<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
(function(){var t=null;try{t=localStorage.getItem("theme")}catch(e){}
if(t!=="light"&&t!=="dark")t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
document.documentElement.setAttribute("data-theme",t)})();
</script>
<title>MB154: Na kolik oblastí může maximálně rozdělit rovinu n kružnic?</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F9;--card:#fff;--ink:#17202B;--muted:#5B6877;--line:#D5DBE3;--acc:#2456A6;--new:#D8431F;--ok:#1F7A4D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161D;--card:#18212B;--ink:#E8EDF3;--muted:#9AA7B6;--line:#2C3947;--acc:#7FB0F5;--new:#FF8A63;--ok:#5BD08F}}
:root[data-theme="dark"] button.p{color:#0B1118}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="dark"]{--bg:#10161D;--card:#18212B;--ink:#E8EDF3;--muted:#9AA7B6;--line:#2C3947;--acc:#7FB0F5;--new:#FF8A63;--ok:#5BD08F}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin:0 0 20px}
h1{font-size:26px;font-weight:500;margin:0}
#theme{white-space:nowrap;flex:none}
.back{display:inline-block;margin:0 0 12px;color:var(--acc);text-decoration:none;font-size:15px}
.back:hover{text-decoration:underline}
.sub{color:var(--muted);margin:0 0 20px;max-width:64ch}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
svg{width:100%;height:auto;display:block}
.ctl{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=range]{flex:1;min-width:120px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.stat b{display:block;font-size:26px;font-weight:500;line-height:1.2}
.stat span{color:var(--muted);font-size:13px}
.big{border-color:var(--acc)}
.big b{color:var(--acc)}
.formula{margin:0 0 12px;font-size:15px}
.eq{font-weight:500;color:var(--acc)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:center}
th{font-weight:500;color:var(--muted)}
tr.cur td{background:var(--bg);font-weight:500;color:var(--acc)}
.leg{font-size:13px;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:baseline}
.sec{margin-top:16px}
.sec h2{font-size:18px;font-weight:500;margin:0 0 8px}
input[type=number]{font:inherit;width:90px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.msg{margin-top:8px;font-size:15px;min-height:1.6em}
.msg.err{color:var(--new)}.msg.ok{color:var(--ok)}
details{margin-top:8px}
summary{cursor:pointer;font-weight:500}
details p{margin:8px 0}
</style>
</head>
<body>
<main>
<a class="back" href="index.html">← Zpět na Jarošku</a>
<div class="top">
<h1>MB154: Na kolik oblastí může maximálně rozdělit rovinu <i>n</i> kružnic?</h1>
<button id="theme" type="button" aria-label="Přepnout světlý/tmavý režim"></button>
</div>

<div class="grid">
  <div class="card">
    <svg id="s" viewBox="0 0 600 600" role="img" aria-label="Kružnice v rovině s vyznačenými průsečíky"></svg>
    <div class="leg"><span class="dot" style="background:var(--new)"></span>nové průsečíky poslední kružnice &nbsp; <span class="dot" style="background:var(--ink)"></span>starší průsečíky</div>
    <div class="ctl">
      <button id="minus" type="button">Ubrat kružnici</button>
      <button id="plus" type="button" class="p">Přidat kružnici</button>
      <button id="replay" type="button">Přehrát od začátku</button>
      <button id="pause" type="button" disabled>Pauza</button>
      <input id="rng" type="range" min="1" max="8" value="1" aria-label="Počet kružnic">
    </div>
    <div class="ctl" style="margin-top:8px">
      <label for="spd" style="font-size:14px;color:var(--muted)">Rychlost animace</label>
      <input id="spd" type="range" min="0.25" max="1" step="0.25" value="1">
      <span id="spdv" style="font-size:14px;min-width:2.5em">1×</span>
    </div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><b id="vN">3</b><span>kružnic</span></div>
      <div class="stat big"><b id="vR">8</b><span>oblastí</span></div>
      <div class="stat"><b id="vP">6</b><span>průsečíků celkem</span></div>
      <div class="stat"><b id="vNew">4</b><span>nových průsečíků</span></div>
      <div class="stat" style="grid-column:1/-1"><b id="vD">+4</b><span>oblastí přibylo poslední kružnicí</span></div>
    </div>
    <p class="formula" id="fm"></p>
    <div class="tw">
      <table id="tb"><thead><tr><th>n</th><th>průsečíky n(n−1)</th><th>nové průsečíky 2(n−1)</th><th>oblasti</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</div>

</main>

<script>
(function(){
var NS="http://www.w3.org/2000/svg",MAX=8,R=100,RR=150,CX=300,CY=300,n=1,busy=false;
var DUR=1500,TWO=Math.PI*2,speed=1,paused=false,replaying=false;
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var svg=document.getElementById("s");
function el(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e}
function ctr(i){var a=i*2.399963;return[CX+R*Math.cos(a),CY+R*Math.sin(a)]}
function hue(i){return[215,12,150,265,35,330,185,90][i%8]}
function f(k){return k*k-k+2}
function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function back(t){var c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}

function build(m,anim){
  svg.innerHTML="";
  var c=[],i,j,pts=[],last=null;
  for(i=0;i<m;i++)c.push(ctr(i));
  for(i=0;i<m;i++){
    var isLast=i===m-1;
    var e=el("circle",{cx:c[i][0],cy:c[i][1],r:RR,fill:"hsl("+hue(i)+",70%,55%)","fill-opacity":0.10,stroke:"hsl("+hue(i)+",65%,50%)","stroke-width":isLast?3.4:1.6});
    if(isLast&&anim){
      var C=TWO*RR;
      e.setAttribute("stroke-dasharray",C);e.setAttribute("stroke-dashoffset",C);e.setAttribute("fill-opacity",0);
      last={el:e,C:C};
    }
  }
  for(i=0;i<m;i++)for(j=i+1;j<m;j++){
    var a=c[i],b=c[j],dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy),mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,h=Math.sqrt(RR*RR-d*d/4),ux=-dy/d,uy=dx/d,isNew=(j===m-1);
    [1,-1].forEach(function(k){
      var px=mx+k*h*ux,py=my+k*h*uy,size=isNew?6:4.2;
      var p=el("circle",{cx:px,cy:py,r:(anim&&isNew)?0:size,fill:isNew?"var(--new)":"var(--ink)",stroke:"var(--card)","stroke-width":1.5});
      var ang=0;
      if(anim&&isNew){ang=Math.atan2(py-c[m-1][1],px-c[m-1][0]);if(ang<0)ang+=TWO}
      pts.push({el:p,size:size,anim:anim&&isNew,ang:ang,born:null});
    });
  }
  return {last:last,pts:pts};
}

function stats(){
  document.getElementById("vN").textContent=n;
  document.getElementById("vP").textContent=n*(n-1);
  document.getElementById("vNew").textContent="+"+(n<2?0:2*(n-1));
  document.getElementById("vR").textContent=f(n);
  document.getElementById("vD").textContent="+"+(n===1?1:2*(n-1));
  document.getElementById("rng").value=n;
  document.getElementById("fm").innerHTML=n===1?"Jedna kružnice dělí rovinu na <span class=\"eq\">2</span> oblasti.":"a<sub>"+n+"</sub> = a<sub>"+(n-1)+"</sub> + 2·"+(n-1)+" = "+f(n-1)+" + "+2*(n-1)+" = <span class=\"eq\">"+f(n)+"</span>";
  var rows=document.querySelectorAll("#tb tbody tr");
  for(var i=0;i<rows.length;i++)rows[i].className=(i+1===n)?"cur":"";
  buttons();
}
function buttons(){
  var lock=busy||replaying;document.getElementById("minus").disabled=lock||n<=1;
  document.getElementById("pause").disabled=!lock;
  document.getElementById("plus").disabled=lock||n>=MAX;
  document.getElementById("rng").disabled=lock;
  document.getElementById("replay").disabled=lock;
}
function showStatic(){build(n,false);stats()}
function wait(ms,cb){var acc=0,pv=null;function fr(t){if(pv===null)pv=t;if(!paused)acc+=t-pv;pv=t;if(acc>=ms)cb();else requestAnimationFrame(fr)}requestAnimationFrame(fr)}

function animateLast(done){
  if(reduce){build(n,false);stats();if(done)done();return}
  busy=true;buttons();
  var o=build(n,true),prev=null,el0=0,sp=speed;
  function frame(t){
    if(prev===null)prev=t;
    if(!paused)el0+=t-prev;
    prev=t;
    var q=Math.min(1,el0/(DUR/sp)),p=ease(q);
    o.last.el.setAttribute("stroke-dashoffset",o.last.C*(1-p));
    o.last.el.setAttribute("fill-opacity",0.10*p);
    o.pts.forEach(function(pt){
      if(!pt.anim)return;
      if(pt.born===null&&p*TWO>=pt.ang)pt.born=el0;
      if(pt.born!==null){var u=Math.min(1,(el0-pt.born)/(350/sp));pt.el.setAttribute("r",pt.size*(u<1?Math.max(0,back(u)):1))}
    });
    if(q<1)requestAnimationFrame(frame);
    else{
      o.last.el.removeAttribute("stroke-dasharray");o.last.el.removeAttribute("stroke-dashoffset");
      o.pts.forEach(function(pt){pt.el.setAttribute("r",pt.size)});
      busy=false;stats();
      if(done)wait(350/sp,done);
    }
  }
  requestAnimationFrame(frame);
}

document.getElementById("pause").onclick=function(){paused=!paused;this.textContent=paused?"Pokračovat":"Pauza"};
document.getElementById("spd").oninput=function(){speed=parseFloat(this.value);document.getElementById("spdv").textContent=String(speed).replace(".",",")+"×"};
var tb=document.querySelector("#tb tbody");
for(var k=1;k<=MAX;k++){var tr=document.createElement("tr");tr.innerHTML="<td>"+k+"</td><td>"+k*(k-1)+"</td><td>"+(k<2?0:2*(k-1))+"</td><td>"+f(k)+"</td>";tb.appendChild(tr)}

document.getElementById("plus").onclick=function(){if(!busy&&n<MAX){n++;animateLast()}};
document.getElementById("minus").onclick=function(){if(!busy&&n>1){n--;showStatic()}};
document.getElementById("rng").oninput=function(){
  if(busy)return;
  var v=parseInt(this.value,10);
  if(v===n+1){n=v;animateLast()}else{n=v;showStatic()}
};
document.getElementById("replay").onclick=function(){
  if(busy)return;
  replaying=true;paused=false;n=1;showStatic();
  (function step(){
    if(n>=MAX){replaying=false;buttons();return}
    n++;animateLast(step);
  })();
};
showStatic();

var tbtn=document.getElementById("theme"),root=document.documentElement;
function curTheme(){return root.getAttribute("data-theme")==="dark"?"dark":"light"}
function paintTheme(){tbtn.textContent=curTheme()==="dark"?"☀️ Světlý režim":"🌙 Tmavý režim"}
tbtn.onclick=function(){
  var t=curTheme()==="dark"?"light":"dark";
  root.setAttribute("data-theme",t);
  try{localStorage.setItem("theme",t)}catch(e){}
  paintTheme();
};
if(window.matchMedia){
  var mq=matchMedia("(prefers-color-scheme: dark)"),onMq=function(e){
    var saved=null;try{saved=localStorage.getItem("theme")}catch(x){}
    if(!saved){root.setAttribute("data-theme",e.matches?"dark":"light");paintTheme()}
  };
  if(mq.addEventListener)mq.addEventListener("change",onMq);
}
paintTheme();
})();
</script>
</body>
</html>
