<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
(function(){var t=null;try{t=localStorage.getItem("theme")}catch(e){}
if(t!=="light"&&t!=="dark")t="light";
document.documentElement.setAttribute("data-theme",t)})();
</script>
<title>Jaroška – informatika pro tercii a kvartu</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F9;--card:#fff;--ink:#17202B;--muted:#5B6877;--line:#D5DBE3;--acc:#2456A6;--new:#D8431F;--ok:#1F7A4D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161D;--card:#18212B;--ink:#E8EDF3;--muted:#9AA7B6;--line:#2C3947;--acc:#7FB0F5;--new:#FF8A63;--ok:#5BD08F}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10161D;--card:#18212B;--ink:#E8EDF3;--muted:#9AA7B6;--line:#2C3947;--acc:#7FB0F5;--new:#FF8A63;--ok:#5BD08F}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin:0 0 8px}
h1{font-size:32px;font-weight:500;margin:0}
.stickers{display:inline-flex;align-items:center;gap:12px;vertical-align:middle;margin-left:16px}
.stickers svg{display:block;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.stickers path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.stickers .o{stroke:#fff}
.stickers .b{stroke:var(--acc)}
.s1 .o{stroke-width:15}.s1 .b{stroke-width:7}
.s2 .o{stroke-width:34}.s2 .b{stroke-width:16}
.s2{--eyes:270deg}
.s2 .eyes{transform-box:fill-box;transform-origin:center;transform:rotate(var(--eyes))}
.author{margin:0 0 4px;font-size:17px;font-weight:500;color:var(--acc)}
.sub{color:var(--muted);margin:0 0 28px;max-width:60ch}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap;flex:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
section{margin:0 0 32px}
h2{font-size:20px;font-weight:500;margin:0 0 4px}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--acc)}
.card b{display:block;font-weight:500;color:var(--acc);margin-bottom:2px}
.card span{color:var(--muted);font-size:14px}
.big{padding:22px 18px}
.big b{font-size:22px}
.empty{border-style:dashed;color:var(--muted);font-size:14px}
footer{color:var(--muted);font-size:13px;margin-top:40px}
footer a{color:inherit}
footer a:hover{color:var(--acc)}
</style>
</head>
<body>
<main>
<div class="top">
  <h1>Jaroška <span class="stickers" aria-hidden="true">
    <svg class="s1" viewBox="0 0 120 160" height="52">
      <g id="sm1"><path class="o" d="M52 17L55 70M83 15L85 65M20 103Q60 150 98 100"/></g>
      <path class="b" d="M52 17L55 70M83 15L85 65M20 103Q60 150 98 100"/>
    </svg>
    <svg class="s2" viewBox="590 970 390 460" height="64">
      <path class="o" d="M750 1405C690 1380 625 1330 618 1260C612 1160 680 1040 800 1005C880 985 945 1030 955 1110C962 1190 925 1270 850 1318C815 1338 780 1343 745 1346M704 1212Q705 1262 745 1262Q800 1255 836 1190"/>
      <path class="b" d="M750 1405C690 1380 625 1330 618 1260C612 1160 680 1040 800 1005C880 985 945 1030 955 1110C962 1190 925 1270 850 1318C815 1338 780 1343 745 1346M704 1212Q705 1262 745 1262Q800 1255 836 1190"/>
      <g class="eyes">
        <path class="o" d="M764 1102Q805 1100 832 1128M778 1140Q812 1142 836 1170"/>
        <path class="b" d="M764 1102Q805 1100 832 1128M778 1140Q812 1142 836 1170"/>
      </g>
    </svg>
  </span></h1>
  <!-- <h1>Jaroška</h1> -->
  <button id="theme" type="button" aria-label="Toggle light/dark mode"></button>
</div>
<p class="author">Andrea Večerková</p>
<p class="sub">Výukové materiály do hodin informatiky pro tercii a kvartu.</p>

<section id="rocniky">
  <h2>Vyberte ročník</h2>
  <div class="cards">
    <a class="card big" href="tercie.html"><b>Tercie</b><span>Materiály a úkoly pro tercii →</span></a>
    <a class="card big" href="kvarta.html"><b>Kvarta</b><span>Materiály a úkoly pro kvartu →</span></a>
  </div>
</section>

<section id="navic">
  <h2>Další materiály</h2>
  <p class="hint">Pro tercii i kvartu.</p>
  <div class="cards">
    <a class="card big" href="navic.html"><b>Další materiály</b><span></span></a>
  </div>
</section>

<footer><a href="https://www.jaroska.cz">Gymnázium Brno, třída Kapitána Jaroše</a> · Andrea Večerková</footer>
</main>

<script>
(function(){
var btn=document.getElementById("theme"),root=document.documentElement;
function cur(){return root.getAttribute("data-theme")==="dark"?"dark":"light"}
function paint(){btn.textContent=cur()==="dark"?"☀️ Light mode":"🌙 Dark mode"}
btn.onclick=function(){var t=cur()==="dark"?"light":"dark";root.setAttribute("data-theme",t);try{localStorage.setItem("theme",t)}catch(e){}paint()};
paint();
})();
</script>
</body>
</html>
