<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
(function(){var t=null;try{t=localStorage.getItem("theme")}catch(e){}
if(t!=="light"&&t!=="dark")t="light";
document.documentElement.setAttribute("data-theme",t)})();
</script>
<title>Jaroška – informatika pro tercii a kvartu</title>
<style>
@font-face{font-family:"LM Roman";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/lmroman-regular.otf") format("opentype")}
@font-face{font-family:"LM Roman";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/lmroman-bold.otf") format("opentype")}

:root{
  --bg:#EEF3FB;--card:#fff;--ink:#0F1F3D;--muted:#51617C;--line:#CFDBEE;--acc:#2456A6;
  --glass:rgba(255,255,255,.62);--glass-line:rgba(255,255,255,.9);--shadow:0 10px 40px rgba(36,86,166,.16);
  --g1:rgba(61,123,255,.32);--g2:rgba(120,190,255,.38);--g3:rgba(36,86,166,.18);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08101F;--card:#2B3240;--ink:#EEF2F8;--muted:#A9B4C6;--line:#3A4353;--acc:#8DBBFF;
  --glass:#2B3240;--glass-line:#3D4658;--shadow:0 10px 40px rgba(0,0,0,.5);
  --g1:rgba(61,123,255,.28);--g2:rgba(40,120,200,.22);--g3:rgba(90,70,200,.18)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#08101F;--card:#2B3240;--ink:#EEF2F8;--muted:#A9B4C6;--line:#3A4353;--acc:#8DBBFF;
  --glass:#2B3240;--glass-line:#3D4658;--shadow:0 10px 40px rgba(0,0,0,.5);
  --g1:rgba(61,123,255,.28);--g2:rgba(40,120,200,.22);--g3:rgba(90,70,200,.18)}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 18px/1.6 "LM Roman","Latin Modern Roman","CMU Serif",Georgia,serif;
  display:flex;flex-direction:column;min-height:100vh;
  min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}

/* modré „aurora“ pozadí – je pevné, takže se nehýbe při scrollování */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60vmax 45vmax at 8% 0%,var(--g1),transparent 60%),
    radial-gradient(55vmax 40vmax at 100% 18%,var(--g2),transparent 60%),
    radial-gradient(50vmax 40vmax at 40% 105%,var(--g3),transparent 60%)}

main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column}

/* hlavička jako rámeček */
.frame{background:var(--glass);border:1px solid var(--glass-line);border-radius:22px;
  padding:20px 24px 22px;margin:0 0 36px;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%)}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin:0 0 6px}
h1{font-size:38px;line-height:1.25;font-weight:700;margin:0}
.author{margin:0 0 2px;font-size:19px;font-weight:700;color:var(--acc)}
.sub{color:var(--muted);margin:0;max-width:60ch}

.stickers{display:inline-flex;align-items:center;gap:12px;vertical-align:middle;margin-left:16px}
.stickers svg{display:block;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.stickers path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.stickers .o{stroke:#fff}
.stickers .b{stroke:var(--acc)}
:root[data-theme="dark"] .stickers .o{stroke:var(--card)}
:root[data-theme="dark"] .stickers svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.s1 .o{stroke-width:15}.s1 .b{stroke-width:7}
.s2 .o{stroke-width:34}.s2 .b{stroke-width:16}
.s2{--eyes:270deg}
.s2 .eyes{transform-box:fill-box;transform-origin:center;transform:rotate(var(--eyes))}

button{font:inherit;font-size:14px;line-height:1.4;border:1px solid var(--glass-line);background:var(--glass);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer;white-space:nowrap;flex:none}
button:hover{border-color:var(--acc)}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

section{margin:0 0 34px}
h2{font-size:24px;font-weight:700;margin:0 0 8px}
.hint{color:var(--muted);font-size:16px;margin:0 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{display:block;background:var(--glass);border:1px solid var(--glass-line);border-radius:18px;padding:16px 18px;color:inherit;text-decoration:none;
  box-shadow:0 4px 18px rgba(36,86,166,.10);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--acc);transform:translateY(-2px)}
.card b{display:block;font-weight:700;color:var(--acc);margin-bottom:2px}
.card span{color:var(--muted);font-size:16px}
.big{padding:24px 20px}
.big b{font-size:26px;line-height:1.25}
.empty{border-style:dashed;color:var(--muted);font-size:16px}

footer{color:var(--muted);font-size:15px;margin-top:auto;padding-top:40px}
footer a{color:inherit}
footer a:hover{color:var(--acc)}

:root[data-theme="dark"] .card{box-shadow:0 4px 18px rgba(0,0,0,.35)}
:root[data-theme="dark"] .frame,:root[data-theme="dark"] .card{-webkit-backdrop-filter:none;backdrop-filter:none}
@media (prefers-reduced-motion:reduce){a.card{transition:none}a.card:hover{transform:none}}
@media (max-width:520px){.frame{padding:16px 16px 18px;border-radius:18px}h1{font-size:32px}.stickers{margin-left:10px}}
</style>
</head>
<body>
<main>

<header class="frame">
  <div class="top">
    <h1>Jaroška <span class="stickers" aria-hidden="true">
      <svg class="s1" viewBox="0 0 120 160" height="52">
        <path class="o" d="M52 17L55 70M83 15L85 65M20 103Q60 150 98 100"/>
        <path class="b" d="M52 17L55 70M83 15L85 65M20 103Q60 150 98 100"/>
      </svg>
      <svg class="s2" viewBox="590 970 390 460" height="64">
        <path class="o" d="M750 1405C690 1380 625 1330 618 1260C612 1160 680 1040 800 1005C880 985 945 1030 955 1110C962 1190 925 1270 850 1318C815 1338 780 1343 745 1346M704 1212Q705 1262 745 1262Q800 1255 836 1190"/>
        <path class="b" d="M750 1405C690 1380 625 1330 618 1260C612 1160 680 1040 800 1005C880 985 945 1030 955 1110C962 1190 925 1270 850 1318C815 1338 780 1343 745 1346M704 1212Q705 1262 745 1262Q800 1255 836 1190"/>
        <g class="eyes">
          <path class="o" d="M764 1102Q805 1100 832 1128M778 1140Q812 1142 836 1170"/>
          <path class="b" d="M764 1102Q805 1100 832 1128M778 1140Q812 1142 836 1170"/>
        </g>
      </svg>
    </span></h1>
    <button id="theme" type="button" aria-label="Toggle light/dark mode"></button>
  </div>
  <p class="author">Andrea Večerková</p>
  <p class="sub">Výukové materiály do hodin informatiky pro tercii a kvartu.</p>
</header>

<section id="rocniky">
  <h2>Vyberte ročník</h2>
  <div class="cards">
    <a class="card big" href="tercie.html"><b>Tercie</b><span>Materiály a úkoly pro tercii →</span></a>
    <a class="card big" href="kvarta.html"><b>Kvarta</b><span>Materiály a úkoly pro kvartu →</span></a>
  </div>
</section>

<section id="navic">
  <h2>Další materiály</h2>
  <p class="hint">Pro tercii i kvartu.</p>
  <div class="cards">
    <a class="card big" href="navic.html"><b>Další materiály</b><span></span></a>
  </div>
</section>

<footer><a href="https://www.jaroska.cz">Gymnázium Brno, třída Kapitána Jaroše</a> · Andrea Večerková</footer>
</main>

<script>
(function(){
var btn=document.getElementById("theme"),root=document.documentElement;
function cur(){return root.getAttribute("data-theme")==="dark"?"dark":"light"}
function paint(){btn.textContent=cur()==="dark"?"☀️ Light mode":"🌙 Dark mode"}
btn.onclick=function(){var t=cur()==="dark"?"light":"dark";root.setAttribute("data-theme",t);try{localStorage.setItem("theme",t)}catch(e){}paint()};
paint();
})();
</script>
</body>
</html>
